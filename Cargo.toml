[workspace]
members = ["bindgen", "fixtures"]

resolver = "3"

[workspace.package]
rust-version = "1.90"

[workspace.dependencies]
uniffi = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.32.2" }
uniffi_bindgen = { git = "https://github.com/mozilla/uniffi-rs.git", tag = "v0.32.2", features = ["cargo-metadata"] }
