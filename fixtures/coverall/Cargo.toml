# Local copy of uniffi-rs's `fixtures/coverall`, taken at tag v0.31.0.
#
# It is vendored rather than used as a git dependency because since v0.30.0 the upstream
# fixture exports an `async fn`, and the C++ bindgen refuses any namespace containing one.
# That would block generating bindings for every other fixture in the library too.
#
# The only deliberate difference from upstream is that `async fn async_bool` is omitted.
# Drop this crate and go back to the upstream git dependency once async is supported.
[package]
name = "uniffi-fixture-coverall"
version = "0.22.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "uniffi_coverall"

[dependencies]
# Add the "scaffolding-ffi-buffer-fns" feature to make sure things can build correctly
uniffi = { workspace = true, features = ["scaffolding-ffi-buffer-fns"] }
once_cell = "1.12"
thiserror = "2"

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }
